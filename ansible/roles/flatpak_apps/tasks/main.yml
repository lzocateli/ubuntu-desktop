---
- name: Instalar integracao Flatpak com GNOME
  ansible.builtin.apt:
    name:
      - flatpak
      - gnome-software
      - gnome-software-plugin-flatpak
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Configurar repositorio Flathub
  community.general.flatpak_remote:
    name: "{{ flatpak_apps_remote }}"
    flatpakrepo_url: "{{ flatpak_apps_remote_url }}"
    state: present
    method: system
  become: true

- name: Montar lista de aplicativos Flatpak
  ansible.builtin.set_fact:
    flatpak_apps_effective: >-
      {{ flatpak_apps_packages
         + (['org.mozilla.firefox'] if flatpak_apps_install_firefox | bool else []) }}

- name: Instalar aplicativos Flatpak
  community.general.flatpak:
    name: "{{ flatpak_apps_effective }}"
    remote: "{{ flatpak_apps_remote }}"
    state: present
    method: system
  become: true

- name: Remover aplicativos Flatpak excluidos do escopo
  community.general.flatpak:
    name: "{{ flatpak_apps_removed_packages }}"
    state: absent
    method: system
  become: true

- name: Validar runtime e repositorio Flatpak
  ansible.builtin.command:
    argv: "{{ item.command }}"
  loop:
    - {name: Flatpak, command: [flatpak, --version]}
    - {name: Flathub, command: [flatpak, remotes, --system, --columns=name]}
  loop_control:
    label: "{{ item.name }}"
  register: flatpak_apps_platform_validation
  changed_when: false
  failed_when: >-
    flatpak_apps_platform_validation.rc != 0 or
    (item.name == 'Flathub' and
     flatpak_apps_remote not in flatpak_apps_platform_validation.stdout_lines)
  when: not ansible_check_mode

- name: Validar pacotes de integracao Flatpak
  ansible.builtin.command:
    argv: [dpkg-query, -W, '-f=${Status}', "{{ item }}"]
  loop:
    - flatpak
    - gnome-software
    - gnome-software-plugin-flatpak
  register: flatpak_apps_package_validation
  changed_when: false
  failed_when: >-
    flatpak_apps_package_validation.rc != 0 or
    'install ok installed' not in flatpak_apps_package_validation.stdout
  when: not ansible_check_mode

- name: Validar aplicativos Flatpak
  ansible.builtin.command:
    argv:
      - flatpak
      - info
      - "{{ item }}"
  loop: "{{ flatpak_apps_effective }}"
  register: flatpak_apps_validation
  changed_when: false
  failed_when: flatpak_apps_validation.rc != 0
  when: not ansible_check_mode

- name: Validar ausencia dos aplicativos Flatpak removidos
  ansible.builtin.command:
    argv:
      - flatpak
      - info
      - "{{ item }}"
  loop: "{{ flatpak_apps_removed_packages }}"
  register: flatpak_apps_removed_validation
  changed_when: false
  failed_when: flatpak_apps_removed_validation.rc == 0
  when: not ansible_check_mode

- name: Configurar Microsoft Edge como navegador padrao do usuario
  ansible.builtin.file:
    path: "{{ ubuntu_desktop_home }}/.config"
    state: directory
    owner: "{{ ubuntu_desktop_user }}"
    group: "{{ ubuntu_desktop_user }}"
    mode: '0755'

- name: Definir tipos de conteudo do Microsoft Edge como navegador padrao
  community.general.ini_file:
    path: "{{ ubuntu_desktop_home }}/.config/mimeapps.list"
    section: Default Applications
    option: "{{ item }}"
    value: com.microsoft.Edge.desktop
    owner: "{{ ubuntu_desktop_user }}"
    group: "{{ ubuntu_desktop_user }}"
    mode: '0644'
    no_extra_spaces: true
  loop:
    - text/html
    - application/xhtml+xml
    - x-scheme-handler/http
    - x-scheme-handler/https

- name: Consultar arquivo desktop exportado pelo Edge Flatpak
  ansible.builtin.stat:
    path: /var/lib/flatpak/exports/share/applications/com.microsoft.Edge.desktop
  register: flatpak_apps_edge_desktop_entry
  when: not ansible_check_mode

- name: Validar arquivo desktop exportado pelo Edge Flatpak
  ansible.builtin.assert:
    that:
      - flatpak_apps_edge_desktop_entry.stat.isreg | default(false)
    fail_msg: O arquivo desktop do Microsoft Edge Flatpak nao foi exportado.
  when: not ansible_check_mode

- name: Validar navegador padrao para HTML e links HTTP/HTTPS
  ansible.builtin.command:
    argv: [xdg-mime, query, default, "{{ item }}"]
  environment:
    HOME: "{{ ubuntu_desktop_home }}"
    XDG_CONFIG_HOME: "{{ ubuntu_desktop_home }}/.config"
  loop:
    - text/html
    - application/xhtml+xml
    - x-scheme-handler/http
    - x-scheme-handler/https
  register: flatpak_apps_default_browser_validation
  changed_when: false
  failed_when: >-
    flatpak_apps_default_browser_validation.rc != 0 or
    flatpak_apps_default_browser_validation.stdout != 'com.microsoft.Edge.desktop'
  when: not ansible_check_mode
