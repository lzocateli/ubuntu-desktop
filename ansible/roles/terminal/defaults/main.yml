---
terminal_configure_zsh: true
terminal_git_user_name: ''
terminal_git_user_email: ''
terminal_onepassword_env_enabled: false
terminal_onepassword_env_account: ''
terminal_onepassword_env_vault: ''
terminal_onepassword_env_document: ''
terminal_wireguard_enabled: false
terminal_wireguard_vault: "{{ terminal_ssh_op_vault }}"
terminal_wireguard_item: VPN UDM Wireguard
terminal_wireguard_profiles:
  - {document: WireGuard-Users-VISION.conf, interface: wg-users}
  - {document: WireGuard-Admin-VISION-ADMIN.conf, interface: wg-admin}
terminal_ssh_op_vault: ''
terminal_ssh_key_items: []
terminal_ssh_hosts: []
terminal_nuget_test_source: https://int.nugettest.org/
terminal_uv_version: 0.8.22
terminal_oh_my_posh_version: 26.23.4
terminal_oh_my_posh_config_file: atomic.omp-VISION.json
terminal_oh_my_posh_config_path: >-
  {{ ubuntu_desktop_home }}/.config/oh-my-posh/{{ terminal_oh_my_posh_config_file }}
terminal_zsh_history_size: 50000
terminal_nerd_fonts_version: 3.4.0
terminal_oh_my_zsh_version: master
terminal_vscode_terminal_font_family: MesloLGM Nerd Font
terminal_vscode_settings_path: "{{ ubuntu_desktop_home }}/.config/Code/User/settings.json"
terminal_vscode_profiles_path: "{{ terminal_vscode_settings_path | dirname }}/profiles"
terminal_devops_image: docker.io/lzocateli/devops:cpu-ubuntu24.04
terminal_copilot_cli_version: 1.0.91
terminal_copilot_cli_checksum: sha256:0e7a0e85290228afecce4d4eed42fda80c0f5b9c86f433deb246cde1d5eec8e5
terminal_uv_archive_url: >-
  https://github.com/astral-sh/uv/releases/download/{{ terminal_uv_version }}/uv-x86_64-unknown-linux-gnu.tar.gz
terminal_copilot_cli_archive_url: >-
  https://github.com/github/copilot-cli/releases/download/v{{ terminal_copilot_cli_version }}/copilot-linux-x64.tar.gz
terminal_oh_my_posh_url: >-
  https://github.com/JanDeDobbeleer/oh-my-posh/releases/download/v{{ terminal_oh_my_posh_version }}/posh-linux-amd64
terminal_nerd_fonts_url: >-
  https://github.com/ryanoasis/nerd-fonts/releases/download/v{{ terminal_nerd_fonts_version }}/Meslo.zip
