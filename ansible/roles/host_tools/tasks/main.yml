---
- name: Criar diretorio de keyrings APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Instalar chaves de repositorios oficiais
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "/etc/apt/keyrings/{{ item.file }}"
    checksum: "{{ item.checksum | default(omit) }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - {file: microsoft.asc, url: https://packages.microsoft.com/keys/microsoft.asc}
    - file: microsoft-2025.asc
      url: https://packages.microsoft.com/keys/microsoft-2025.asc
      checksum: "sha256:{{ host_tools_microsoft_2025_key_sha256 }}"
    - {file: hashicorp.asc, url: https://apt.releases.hashicorp.com/gpg}
    - {file: kubernetes.asc, url: "https://pkgs.k8s.io/core:/stable:/{{ host_tools_kubernetes_repository_version }}/deb/Release.key"}
    - {file: githubcli.gpg, url: https://cli.github.com/packages/githubcli-archive-keyring.gpg}
    - {file: 1password.asc, url: https://downloads.1password.com/linux/keys/1password.asc}
    - {file: google-chrome.asc, url: https://dl.google.com/linux/linux_signing_key.pub}
    - {file: mullvad.asc, url: https://repository.mullvad.net/deb/mullvad-keyring.asc}
    - {file: claude-code.asc, url: https://downloads.claude.ai/keys/claude-code.asc}
  loop_control:
    label: "{{ item.file }}"
  become: true

- name: Consultar fingerprint da chave oficial do Claude Code
  ansible.builtin.command:
    argv:
      - gpg
      - --show-keys
      - --with-colons
      - --fingerprint
      - /etc/apt/keyrings/claude-code.asc
  register: host_tools_claude_code_key
  changed_when: false
  failed_when: host_tools_claude_code_key.rc != 0
  when: not ansible_check_mode

- name: Validar fingerprint da chave oficial do Claude Code
  ansible.builtin.assert:
    that:
      - >-
        ('FPR:::::::::' ~ (host_tools_claude_code_key_fingerprint | upper) ~ ':')
        in (host_tools_claude_code_key.stdout_lines | map('upper') | list)
    fail_msg: A chave APT do Claude Code nao corresponde ao fingerprint oficial da Anthropic.
  when: not ansible_check_mode

- name: Configurar repositorios APT oficiais
  ansible.builtin.deb822_repository:
    name: "{{ item.name }}"
    types: [deb]
    uris: "{{ item.uri }}"
    suites: "{{ item.suite }}"
    components: "{{ item.components | default(omit) }}"
    architectures: "{{ [host_tools_apt_architecture] if item.architecture | default(true) else omit }}"
    signed_by: "/etc/apt/keyrings/{{ item.key }}"
    state: present
  loop:
    - {name: microsoft-prod, uri: https://packages.microsoft.com/ubuntu/26.04/prod, suite: resolute, components: [main], key: microsoft-2025.asc}
    - {name: azure-cli, uri: https://packages.microsoft.com/repos/azure-cli, suite: resolute, components: [main], key: microsoft.asc}
    - {name: vscode, uri: https://packages.microsoft.com/repos/code, suite: stable, components: [main], key: microsoft.asc}
    - {name: hashicorp, uri: https://apt.releases.hashicorp.com, suite: resolute, components: [main], key: hashicorp.asc}
    - name: kubernetes
      uri: "https://pkgs.k8s.io/core:/stable:/{{ host_tools_kubernetes_repository_version }}/deb/"
      suite: /
      architecture: false
      key: kubernetes.asc
    - {name: github-cli, uri: https://cli.github.com/packages, suite: stable, components: [main], key: githubcli.gpg}
    - {name: 1password, uri: https://downloads.1password.com/linux/debian/amd64, suite: stable, components: [main], key: 1password.asc}
    - {name: google-chrome, uri: https://dl.google.com/linux/chrome/deb, suite: stable, components: [main], key: google-chrome.asc}
    - {name: mullvad, uri: https://repository.mullvad.net/deb/stable, suite: stable, components: [main], key: mullvad.asc}
    - name: claude-code
      uri: "{{ host_tools_claude_code_apt_uri }}"
      suite: stable
      components: [main]
      key: claude-code.asc
  loop_control:
    label: "{{ item.name }}"
  become: true
  notify: Atualizar cache APT

- name: Aplicar atualizacao do cache APT
  ansible.builtin.meta: flush_handlers

- name: Montar lista de ferramentas do host
  ansible.builtin.set_fact:
    host_tools_packages_effective: >-
      {{ host_tools_packages
         + (['1password']
            if host_tools_install_1password | bool else []) }}

- name: Instalar ferramentas do host
  ansible.builtin.apt:
    name: "{{ host_tools_packages_effective }}"
    state: present
  become: true

- name: Instalar RTK
  ansible.builtin.include_tasks:
    file: rtk.yml
    apply:
      tags: [rtk]
  tags: [rtk]

- name: Consultar instalacao do PowerShell
  ansible.builtin.stat:
    path: "{{ host_tools_powershell_install_dir }}/{{ host_tools_powershell_version }}/pwsh"
  register: host_tools_powershell_installation
  become: true

- name: Criar diretorio de instalacao do PowerShell
  ansible.builtin.file:
    path: "{{ host_tools_powershell_install_dir }}/{{ host_tools_powershell_version }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  when: not host_tools_powershell_installation.stat.exists

- name: Baixar PowerShell oficial com checksum SHA-256
  ansible.builtin.get_url:
    url: "https://github.com/PowerShell/PowerShell/releases/download/v{{ host_tools_powershell_version }}/powershell-{{ host_tools_powershell_version }}-linux-x64.tar.gz"
    dest: "/var/cache/powershell-{{ host_tools_powershell_version }}-linux-x64.tar.gz"
    checksum: "sha256:{{ host_tools_powershell_sha256 }}"
    owner: root
    group: root
    mode: '0644'
  become: true
  when: not host_tools_powershell_installation.stat.exists

- name: Extrair PowerShell isolado do gerenciador APT
  ansible.builtin.unarchive:
    src: "/var/cache/powershell-{{ host_tools_powershell_version }}-linux-x64.tar.gz"
    dest: "{{ host_tools_powershell_install_dir }}/{{ host_tools_powershell_version }}"
    remote_src: true
    creates: "{{ host_tools_powershell_install_dir }}/{{ host_tools_powershell_version }}/pwsh"
  become: true
  when: not host_tools_powershell_installation.stat.exists

- name: Garantir permissao executavel do PowerShell
  ansible.builtin.file:
    path: "{{ host_tools_powershell_install_dir }}/{{ host_tools_powershell_version }}/pwsh"
    state: file
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Expor PowerShell no PATH do sistema
  ansible.builtin.file:
    src: "{{ host_tools_powershell_install_dir }}/{{ host_tools_powershell_version }}/pwsh"
    dest: /usr/local/bin/pwsh
    state: link
    owner: root
    group: root
  become: true

- name: Remover arquivo temporario do PowerShell
  ansible.builtin.file:
    path: "/var/cache/powershell-{{ host_tools_powershell_version }}-linux-x64.tar.gz"
    state: absent
  become: true
  when: not host_tools_powershell_installation.stat.exists

- name: Migrar instalacoes legadas do .NET com confirmacao
  ansible.builtin.include_tasks:
    file: dotnet-migration.yml
    apply:
      tags: [dotnet_migration]
  when: host_tools_remove_legacy_dotnet | bool
  tags: [dotnet_migration]

- name: Validar destino e SDKs .NET do usuario
  ansible.builtin.assert:
    that:
      - host_tools_dotnet_install_dir == ubuntu_desktop_home ~ '/.dotnet'
      - host_tools_dotnet_sdks | length > 0
      - host_tools_dotnet_sdks | map(attribute='version') | unique | length == host_tools_dotnet_sdks | length
  tags: [dotnet]

- name: Criar diretorio de instalacao do .NET do usuario
  ansible.builtin.file:
    path: "{{ host_tools_dotnet_install_dir }}"
    state: directory
    owner: "{{ ubuntu_desktop_user }}"
    group: "{{ ubuntu_desktop_user }}"
    mode: '0755'
  become: false
  tags: [dotnet]

- name: Instalar SDKs .NET lado a lado no home
  ansible.builtin.include_tasks:
    file: dotnet-sdk.yml
    apply:
      tags: [dotnet]
  loop: "{{ host_tools_dotnet_sdks }}"
  loop_control:
    loop_var: host_tools_dotnet_sdk
    label: "{{ host_tools_dotnet_sdk.version }}"
  tags: [dotnet]

- name: Criar diretorios de configuracao rootless do Podman
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ ubuntu_desktop_user }}"
    group: "{{ ubuntu_desktop_user }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ ubuntu_desktop_home }}/.config/containers", mode: '0750'}
    - {path: "{{ ubuntu_desktop_home }}/.config/containers/networks", mode: '0750'}
    - {path: "{{ ubuntu_desktop_home }}/.local/share/containers/storage", mode: '0750'}

- name: Instalar configuracoes rootless do Podman
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ ubuntu_desktop_home }}/.config/containers/{{ item.dest }}"
    owner: "{{ ubuntu_desktop_user }}"
    group: "{{ ubuntu_desktop_user }}"
    mode: '0644'
  loop:
    - {src: containers.conf.j2, dest: containers.conf}
    - {src: storage.conf.j2, dest: storage.conf}

- name: Consultar confianca do certificado HTTPS de desenvolvimento .NET
  ansible.builtin.command:
    argv: ["{{ host_tools_dotnet_install_dir }}/dotnet", dev-certs, https, --check, --trust]
  environment:
    HOME: "{{ ubuntu_desktop_home }}"
    DOTNET_CLI_HOME: "{{ ubuntu_desktop_home }}"
    SSL_CERT_DIR: "{{ ubuntu_desktop_home }}/.aspnet/dev-certs/trust:/usr/lib/ssl/certs"
  register: host_tools_dotnet_dev_certificate
  changed_when: false
  failed_when: false
  when:
    - host_tools_configure_dotnet_dev_certificate | bool
    - not ansible_check_mode

- name: Confiar no certificado HTTPS de desenvolvimento .NET
  ansible.builtin.command:
    argv: ["{{ host_tools_dotnet_install_dir }}/dotnet", dev-certs, https, --trust]
  environment:
    HOME: "{{ ubuntu_desktop_home }}"
    DOTNET_CLI_HOME: "{{ ubuntu_desktop_home }}"
    SSL_CERT_DIR: "{{ ubuntu_desktop_home }}/.aspnet/dev-certs/trust:/usr/lib/ssl/certs"
  changed_when: true
  when:
    - host_tools_configure_dotnet_dev_certificate | bool
    - not ansible_check_mode
    - host_tools_dotnet_dev_certificate.rc != 0

- name: Informar limitacao do check mode para o certificado .NET
  ansible.builtin.debug:
    msg: >-
      A confianca do certificado HTTPS .NET nao e consultada em check mode.
      A consulta, eventual criacao e confianca serao aplicadas somente no modo real.
  when:
    - host_tools_configure_dotnet_dev_certificate | bool
    - ansible_check_mode

- name: Validar confianca do certificado HTTPS de desenvolvimento .NET
  ansible.builtin.command:
    argv: ["{{ host_tools_dotnet_install_dir }}/dotnet", dev-certs, https, --check, --trust]
  environment:
    HOME: "{{ ubuntu_desktop_home }}"
    DOTNET_CLI_HOME: "{{ ubuntu_desktop_home }}"
    SSL_CERT_DIR: "{{ ubuntu_desktop_home }}/.aspnet/dev-certs/trust:/usr/lib/ssl/certs"
  register: host_tools_dotnet_dev_certificate_validation
  changed_when: false
  failed_when: host_tools_dotnet_dev_certificate_validation.rc != 0
  when:
    - host_tools_configure_dotnet_dev_certificate | bool
    - not ansible_check_mode

- name: Validar pacotes das ferramentas do host
  ansible.builtin.command:
    argv: [dpkg-query, -W, '-f=${Status}', "{{ item }}"]
  loop: "{{ host_tools_packages_effective }}"
  register: host_tools_package_validation
  changed_when: false
  failed_when: >-
    host_tools_package_validation.rc != 0 or
    'install ok installed' not in host_tools_package_validation.stdout
  when: not ansible_check_mode

- name: Validar execucao rootless do Podman
  ansible.builtin.command:
    argv: [podman, info, --format, "{{ '{{' }}.Host.Security.Rootless{{ '}}' }}"]
  register: host_tools_podman_rootless_validation
  changed_when: false
  failed_when: >-
    host_tools_podman_rootless_validation.rc != 0 or
    host_tools_podman_rootless_validation.stdout != 'true'
  environment:
    HOME: "{{ ubuntu_desktop_home }}"
  when: not ansible_check_mode

- name: Validar ferramentas de desenvolvimento instaladas
  ansible.builtin.command:
    argv: "{{ item.command }}"
  loop:
    - {name: Podman, command: [podman, --version]}
    - {name: Podman Compose, command: [podman, compose, version]}
    - {name: WireGuard CLI, command: [wg, --version]}
    - {name: PowerShell, command: [pwsh, --version]}
    - {name: Azure CLI, command: [az, version]}
    - {name: Terraform, command: [terraform, version]}
    - {name: kubectl, command: [kubectl, version, --client]}
    - {name: GitHub CLI, command: [gh, --version]}
    - {name: Claude Code CLI, command: [claude, --version]}
    - {name: VS Code, command: [code, --version]}
    - {name: .NET SDKs, command: ["{{ host_tools_dotnet_install_dir }}/dotnet", --list-sdks]}
  loop_control:
    label: "{{ item.name }}"
  register: host_tools_validation
  changed_when: false
  failed_when: host_tools_validation.rc != 0
  environment:
    HOME: "{{ ubuntu_desktop_home }}"
  when: not ansible_check_mode

- name: Validar versoes dos SDKs .NET do usuario
  ansible.builtin.command:
    argv: ["{{ host_tools_dotnet_install_dir }}/dotnet", --list-sdks]
  register: host_tools_dotnet_sdk_validation
  changed_when: false
  failed_when: >-
    host_tools_dotnet_sdk_validation.rc != 0 or
    (host_tools_dotnet_sdk.version ~ ' [' ~ host_tools_dotnet_install_dir ~ '/sdk]')
    not in host_tools_dotnet_sdk_validation.stdout_lines
  loop: "{{ host_tools_dotnet_sdks }}"
  loop_control:
    loop_var: host_tools_dotnet_sdk
    label: "{{ host_tools_dotnet_sdk.version }}"
  when: not ansible_check_mode
  tags: [dotnet]

- name: Validar ferramentas 1Password
  ansible.builtin.command:
    argv: "{{ item.command }}"
  loop:
    - {name: 1Password Desktop, command: [1password, --version]}
  loop_control:
    label: "{{ item.name }}"
  register: host_tools_1password_validation
  changed_when: false
  failed_when: host_tools_1password_validation.rc != 0
  when:
    - not ansible_check_mode
    - host_tools_install_1password | bool

- name: Validar versao do Google Chrome
  ansible.builtin.command:
    argv: [google-chrome, --version]
  register: host_tools_chrome_validation
  changed_when: false
  failed_when: host_tools_chrome_validation.rc != 0
  when: not ansible_check_mode

- name: Validar cliente Mullvad CLI
  ansible.builtin.command:
    argv: [mullvad, --help]
  register: host_tools_mullvad_cli_validation
  changed_when: false
  failed_when: host_tools_mullvad_cli_validation.rc != 0
  when: not ansible_check_mode

- name: Validar instalacao do aplicativo grafico Mullvad
  ansible.builtin.stat:
    path: /opt/Mullvad VPN/mullvad-vpn
  register: host_tools_mullvad_desktop_validation
  when: not ansible_check_mode

- name: Confirmar aplicativo grafico Mullvad instalado
  ansible.builtin.assert:
    that:
      - host_tools_mullvad_desktop_validation.stat.executable | default(false)
    fail_msg: O executavel grafico do Mullvad nao foi instalado.
  when: not ansible_check_mode
