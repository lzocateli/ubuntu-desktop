---
- name: Preparar imagem DevOps publica e CLI 1Password rootless
  ansible.builtin.import_tasks: devops-container.yml

- name: Validar configuracao do ambiente via 1Password
  ansible.builtin.assert:
    that:
      - host_tools_install_1password | default(false) | bool
      - terminal_onepassword_env_vault | length > 0
      - terminal_onepassword_env_document | length > 0
    fail_msg: >-
      Habilitar o ambiente via 1Password exige a instalacao do 1Password,
      o vault e o nome do documento.
  when: terminal_onepassword_env_enabled | bool

- name: Configurar chaves SSH do 1Password
  ansible.builtin.include_tasks: ssh.yml
  tags: [ssh_config, ssh_permissions]

- name: Configurar perfis WireGuard do 1Password
  ansible.builtin.include_tasks: wireguard.yml

- name: Criar cache persistente da automacao
  ansible.builtin.file:
    path: /var/cache/ubuntu-desktop
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Baixar Copilot CLI
  ansible.builtin.get_url:
    url: "{{ terminal_copilot_cli_archive_url }}"
    dest: "/var/cache/ubuntu-desktop/copilot-{{ terminal_copilot_cli_version }}-linux-x64.tar.gz"
    checksum: "{{ terminal_copilot_cli_checksum }}"
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Criar diretorio da versao do Copilot CLI
  ansible.builtin.file:
    path: "/opt/copilot-cli/{{ terminal_copilot_cli_version }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Extrair Copilot CLI
  ansible.builtin.unarchive:
    src: "/var/cache/ubuntu-desktop/copilot-{{ terminal_copilot_cli_version }}-linux-x64.tar.gz"
    dest: "/opt/copilot-cli/{{ terminal_copilot_cli_version }}"
    remote_src: true
    creates: "/opt/copilot-cli/{{ terminal_copilot_cli_version }}/copilot"
  become: true

- name: Configurar permissoes do Copilot CLI
  ansible.builtin.file:
    path: "/opt/copilot-cli/{{ terminal_copilot_cli_version }}/copilot"
    state: file
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Publicar Copilot CLI
  ansible.builtin.file:
    src: "/opt/copilot-cli/{{ terminal_copilot_cli_version }}/copilot"
    dest: /usr/local/bin/copilot
    state: link
    owner: root
    group: root
    force: true
  become: true

- name: Configurar integracoes globais RTK para agentes de IA
  ansible.builtin.include_tasks:
    file: rtk-agents.yml
    apply:
      tags: [rtk_agents]
  tags: [rtk_agents]

- name: Baixar arquivo do uv
  ansible.builtin.get_url:
    url: "{{ terminal_uv_archive_url }}"
    dest: "/var/cache/ubuntu-desktop/uv-{{ terminal_uv_version }}.tar.gz"
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Criar diretorio da versao do uv
  ansible.builtin.file:
    path: "/opt/uv/{{ terminal_uv_version }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Extrair uv
  ansible.builtin.unarchive:
    src: "/var/cache/ubuntu-desktop/uv-{{ terminal_uv_version }}.tar.gz"
    dest: "/opt/uv/{{ terminal_uv_version }}"
    remote_src: true
    creates: "/opt/uv/{{ terminal_uv_version }}/uv-x86_64-unknown-linux-gnu/uv"
  become: true

- name: Publicar executaveis do uv
  ansible.builtin.file:
    src: "/opt/uv/{{ terminal_uv_version }}/uv-x86_64-unknown-linux-gnu/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    owner: root
    group: root
    force: true
  loop:
    - uv
    - uvx
  become: true

- name: Instalar Oh My Posh
  ansible.builtin.get_url:
    url: "{{ terminal_oh_my_posh_url }}"
    dest: /usr/local/bin/oh-my-posh
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Instalar Oh My Zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "{{ ubuntu_desktop_home }}/.oh-my-zsh"
    version: "{{ terminal_oh_my_zsh_version }}"
    update: false

- name: Criar diretorio de plugins customizados do Oh My Zsh
  ansible.builtin.file:
    path: "{{ ubuntu_desktop_home }}/.oh-my-zsh/custom/plugins"
    state: directory
    owner: "{{ ubuntu_desktop_user }}"
    group: "{{ ubuntu_desktop_user }}"
    mode: '0755'
  when: terminal_configure_zsh | bool
  tags: [zsh]

- name: Instalar plugin zsh-autosuggestions
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-autosuggestions.git
    dest: "{{ ubuntu_desktop_home }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
    version: "{{ terminal_zsh_autosuggestions_version }}"
    update: false
  when: terminal_configure_zsh | bool
  tags: [zsh]

- name: Configurar feeds NuGet do usuario
  ansible.builtin.include_tasks: nuget.yml

- name: Criar diretorio de fontes do usuario
  ansible.builtin.file:
    path: "{{ ubuntu_desktop_home }}/.local/share/fonts/MesloLGM-Nerd-Font-{{ terminal_nerd_fonts_version }}"
    state: directory
    owner: "{{ ubuntu_desktop_user }}"
    group: "{{ ubuntu_desktop_user }}"
    mode: '0755'

- name: Baixar MesloLGM Nerd Font
  ansible.builtin.get_url:
    url: "{{ terminal_nerd_fonts_url }}"
    dest: "/var/cache/ubuntu-desktop/Meslo-{{ terminal_nerd_fonts_version }}.zip"
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Instalar MesloLGM Nerd Font
  ansible.builtin.unarchive:
    src: "/var/cache/ubuntu-desktop/Meslo-{{ terminal_nerd_fonts_version }}.zip"
    dest: "{{ ubuntu_desktop_home }}/.local/share/fonts/MesloLGM-Nerd-Font-{{ terminal_nerd_fonts_version }}"
    remote_src: true
    creates: >-
      {{ ubuntu_desktop_home }}/.local/share/fonts/MesloLGM-Nerd-Font-{{ terminal_nerd_fonts_version }}/MesloLGMNerdFont-Regular.ttf
  notify: Atualizar cache de fontes

- name: Configurar fonte no perfil padrao do Tilix
  ansible.builtin.include_tasks:
    file: tilix.yml
    apply:
      tags: [tilix]
  tags: [tilix]
  when: terminal_configure_tilix | bool

- name: Configurar fonte Meslo no terminal integrado do VS Code
  ansible.builtin.include_tasks:
    file: vscode-settings.yml
    apply:
      tags: [vscode]
  tags: [vscode]

- name: Validar configuracao JSON do tema Oh My Posh
  ansible.builtin.assert:
    that:
      - (lookup('file', role_path ~ '/files/' ~ terminal_oh_my_posh_config_file) | from_json).version == 3
      - (lookup('file', role_path ~ '/files/' ~ terminal_oh_my_posh_config_file) | from_json).blocks | length > 0
    fail_msg: O tema Oh My Posh precisa ser um JSON v3 valido com blocos de prompt.
  when: terminal_configure_zsh | bool
  tags: [zsh]

- name: Criar diretorio de configuracao do Oh My Posh
  ansible.builtin.file:
    path: "{{ terminal_oh_my_posh_config_path | dirname }}"
    state: directory
    owner: "{{ ubuntu_desktop_user }}"
    group: "{{ ubuntu_desktop_user }}"
    mode: '0750'
  when: terminal_configure_zsh | bool
  tags: [zsh]

- name: Instalar tema Oh My Posh do projeto
  ansible.builtin.copy:
    src: "{{ terminal_oh_my_posh_config_file }}"
    dest: "{{ terminal_oh_my_posh_config_path }}"
    owner: "{{ ubuntu_desktop_user }}"
    group: "{{ ubuntu_desktop_user }}"
    mode: '0644'
  when: terminal_configure_zsh | bool
  tags: [zsh]

- name: Criar arquivo persistente de historico ZSH sem sobrescrever historico existente
  ansible.builtin.copy:
    content: ''
    dest: "{{ ubuntu_desktop_home }}/.zsh_history"
    force: false
    owner: "{{ ubuntu_desktop_user }}"
    group: "{{ ubuntu_desktop_user }}"
    mode: '0600'
  when: terminal_configure_zsh | bool
  tags: [zsh]

- name: Configurar ZSH e Oh My Posh
  ansible.builtin.blockinfile:
    path: "{{ ubuntu_desktop_home }}/.zshrc"
    create: true
    owner: "{{ ubuntu_desktop_user }}"
    group: "{{ ubuntu_desktop_user }}"
    mode: '0644'
    marker: '# {mark} ANSIBLE UBUNTU DESKTOP'
    block: |
      if [ -r "$HOME/.profile" ]; then
        . "$HOME/.profile"
      fi
      export ZSH="$HOME/.oh-my-zsh"
      HISTFILE="$HOME/.zsh_history"
      HISTSIZE={{ terminal_zsh_history_size }}
      SAVEHIST={{ terminal_zsh_history_size }}
      setopt APPEND_HISTORY SHARE_HISTORY EXTENDED_HISTORY
      setopt HIST_IGNORE_DUPS HIST_IGNORE_SPACE HIST_REDUCE_BLANKS
      ZSH_THEME=""
      plugins=(git history-substring-search zsh-autosuggestions)
      source "$ZSH/oh-my-zsh.sh"
      eval "$(oh-my-posh init zsh --config {{ terminal_oh_my_posh_config_path | quote }})"
  when: terminal_configure_zsh | bool
  tags: [zsh]

- name: Criar diretorio de integracao do terminal
  ansible.builtin.file:
    path: "{{ ubuntu_desktop_home }}/.local/lib/ubuntu-desktop"
    state: directory
    owner: "{{ ubuntu_desktop_user }}"
    group: "{{ ubuntu_desktop_user }}"
    mode: '0700'
  tags: [dotnet_env]

- name: Criar diretorios persistentes das ferramentas em container
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ubuntu_desktop_user }}"
    group: "{{ ubuntu_desktop_user }}"
    mode: '0700'
  loop:
    - "{{ ubuntu_desktop_home }}/.local/share/ubuntu-desktop/devops-home"

- name: Instalar Angular CLI no prefixo persistente do usuario
  ansible.builtin.import_tasks: angular-cli.yml

- name: Instalar funcoes individuais das ferramentas de desenvolvimento
  ansible.builtin.template:
    src: "{{ item }}.sh.j2"
    dest: "{{ ubuntu_desktop_home }}/.local/lib/ubuntu-desktop/{{ item }}.sh"
    owner: "{{ ubuntu_desktop_user }}"
    group: "{{ ubuntu_desktop_user }}"
    mode: '0600'
    validate: bash -n %s
  loop: [node, npm, npx, ng, op, lh, lhr]
  tags: [dotnet_env]

- name: Instalar integracao das ferramentas de desenvolvimento em container
  ansible.builtin.template:
    src: development-shell.sh.j2
    dest: "{{ ubuntu_desktop_home }}/.local/lib/ubuntu-desktop/development-shell.sh"
    owner: "{{ ubuntu_desktop_user }}"
    group: "{{ ubuntu_desktop_user }}"
    mode: '0600'
  tags: [dotnet_env]

- name: Carregar integracao de desenvolvimento nos shells
  diff: false
  ansible.builtin.blockinfile:
    path: "{{ item.path }}"
    create: true
    owner: "{{ ubuntu_desktop_user }}"
    group: "{{ ubuntu_desktop_user }}"
    mode: "{{ item.mode }}"
    marker: '# {mark} ANSIBLE DEVELOPMENT SHELL'
    block: |
      if [ -n "${BASH_VERSION:-}${ZSH_VERSION:-}" ] &&
         [ -r "$HOME/.local/lib/ubuntu-desktop/development-shell.sh" ]; then
        . "$HOME/.local/lib/ubuntu-desktop/development-shell.sh"
      fi
  loop:
    - path: "{{ ubuntu_desktop_home }}/.profile"
      mode: '0600'
    - path: "{{ ubuntu_desktop_home }}/.bashrc"
      mode: '0644'
    - path: "{{ ubuntu_desktop_home }}/.zshrc"
      mode: '0644'
  tags: [dotnet_env]

- name: Configurar ambiente POSIX no profile sem sobrescrever variaveis existentes
  ansible.builtin.blockinfile:
    path: "{{ ubuntu_desktop_home }}/.profile"
    create: true
    owner: "{{ ubuntu_desktop_user }}"
    group: "{{ ubuntu_desktop_user }}"
    mode: '0600'
    marker: '# {mark} ANSIBLE USER DOTNET'
    block: |
      export DOTNET_ROOT="${DOTNET_ROOT:-$HOME/.dotnet}"
      export SSL_CERT_DIR="${SSL_CERT_DIR:-$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs}"
      case ":$PATH:" in
        *":$HOME/.local/bin:"*) ;;
        *) export PATH="$HOME/.local/bin:$PATH" ;;
      esac
      case ":$PATH:" in
        *":$DOTNET_ROOT/tools:"*) ;;
        *) export PATH="$DOTNET_ROOT/tools:$PATH" ;;
      esac
      case ":$PATH:" in
        *":$DOTNET_ROOT:"*) ;;
        *) export PATH="$DOTNET_ROOT:$PATH" ;;
      esac
  no_log: true
  diff: false
  tags: [dotnet_env]

- name: Instalar renderizador seguro do ambiente do 1Password
  ansible.builtin.copy:
    src: render-1password-env.sh
    dest: "{{ ubuntu_desktop_home }}/.local/lib/ubuntu-desktop/render-1password-env.sh"
    owner: "{{ ubuntu_desktop_user }}"
    group: "{{ ubuntu_desktop_user }}"
    mode: '0700'
  when: terminal_onepassword_env_enabled | bool

- name: Baixar e validar documento de ambiente do 1Password
  ansible.builtin.command:
    argv:
      - "{{ ubuntu_desktop_home }}/.local/lib/ubuntu-desktop/render-1password-env.sh"
      - "{{ terminal_onepassword_env_vault }}"
      - "{{ terminal_onepassword_env_document }}"
      - "{{ terminal_onepassword_env_account }}"
      - "{{ ubuntu_desktop_home }}/.profile"
  register: terminal_onepassword_env_exports
  environment:
    HOME: "{{ ubuntu_desktop_home }}"
    PATH: "{{ ubuntu_desktop_home }}/.local/bin:{{ ansible_env.PATH }}"
    OP_SERVICE_ACCOUNT_TOKEN: "{{ lookup('ansible.builtin.env', 'OP_SERVICE_ACCOUNT_TOKEN') }}"
  changed_when: false
  no_log: true
  when:
    - terminal_onepassword_env_enabled | bool
    - not ansible_check_mode

- name: Validar documento de ambiente renderizado
  ansible.builtin.assert:
    that:
      - terminal_onepassword_env_exports.stdout | default('') | length > 0
    fail_msg: O documento do 1Password nao possui variaveis de ambiente validas.
  no_log: true
  when:
    - terminal_onepassword_env_enabled | bool
    - not ansible_check_mode

- name: Incorporar ambiente do 1Password ao profile Bash
  ansible.builtin.blockinfile:
    path: "{{ ubuntu_desktop_home }}/.profile"
    create: true
    owner: "{{ ubuntu_desktop_user }}"
    group: "{{ ubuntu_desktop_user }}"
    mode: '0600'
    marker: '# {mark} ANSIBLE 1PASSWORD ENV'
    block: "{{ terminal_onepassword_env_exports.stdout }}"
  no_log: true
  diff: false
  when:
    - terminal_onepassword_env_enabled | bool
    - not ansible_check_mode

- name: Consultar profiles com carregamento runtime antigo
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ ubuntu_desktop_home }}/.bashrc"
    - "{{ ubuntu_desktop_home }}/.zshrc"
  register: terminal_onepassword_legacy_profiles

- name: Remover carregamento runtime antigo dos shells
  ansible.builtin.blockinfile:
    path: "{{ item.stat.path }}"
    marker: '# {mark} ANSIBLE 1PASSWORD ENV'
    state: absent
  no_log: true
  diff: false
  loop: "{{ terminal_onepassword_legacy_profiles.results }}"
  when: item.stat.exists

- name: Consultar profile Bash persistente
  ansible.builtin.stat:
    path: "{{ ubuntu_desktop_home }}/.profile"
  register: terminal_onepassword_profile

- name: Remover ambiente persistente quando desabilitado
  ansible.builtin.blockinfile:
    path: "{{ ubuntu_desktop_home }}/.profile"
    marker: '# {mark} ANSIBLE 1PASSWORD ENV'
    state: absent
  no_log: true
  diff: false
  when:
    - not terminal_onepassword_env_enabled | bool
    - terminal_onepassword_profile.stat.exists

- name: Remover auxiliares de ambiente desabilitados ou obsoletos
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop:
    - path: "{{ ubuntu_desktop_home }}/.local/lib/ubuntu-desktop/load-1password-env.sh"
      remove: true
    - path: "{{ ubuntu_desktop_home }}/.local/lib/ubuntu-desktop/render-1password-env.sh"
      remove: "{{ not terminal_onepassword_env_enabled | bool }}"
  when: item.remove | bool

- name: Informar limitacao do check mode para o ambiente 1Password
  ansible.builtin.debug:
    msg: >-
      Check mode nao baixa o documento do 1Password nem altera o bloco secreto
      em ~/.profile. A operacao ocorre somente no modo real.
  when:
    - terminal_onepassword_env_enabled | bool
    - ansible_check_mode

- name: Definir ZSH como shell padrao
  ansible.builtin.user:
    name: "{{ ubuntu_desktop_user }}"
    shell: /usr/bin/zsh
  become: true
  when: terminal_configure_zsh | bool

- name: Aplicar atualizacao do cache de fontes
  ansible.builtin.meta: flush_handlers

- name: Validar uv, Oh My Posh, Copilot e CLI 1Password em container
  ansible.builtin.command:
    argv: "{{ item.command }}"
  loop:
    - {name: uv, command: [uv, --version]}
    - {name: uvx, command: [uvx, --version]}
    - {name: Oh My Posh, command: [oh-my-posh, version]}
    - {name: Copilot CLI, command: [copilot, --version]}
    - name: 1Password CLI em container
      command: ["{{ ubuntu_desktop_home }}/.local/bin/op", --version]
  loop_control:
    label: "{{ item.name }}"
  register: terminal_validation
  changed_when: false
  failed_when: terminal_validation.rc != 0
  when: not ansible_check_mode

- name: Validar sintaxe do profile com ambiente do 1Password
  ansible.builtin.command:
    argv:
      - bash
      - -n
      - "{{ ubuntu_desktop_home }}/.profile"
  register: terminal_onepassword_env_validation
  changed_when: false
  when:
    - not ansible_check_mode
    - terminal_onepassword_env_enabled | bool

- name: Validar integracao das ferramentas em Bash e ZSH
  ansible.builtin.command:
    argv:
      - "{{ item.shell }}"
      - -c
      - >-
        . {{ ubuntu_desktop_home }}/.local/lib/ubuntu-desktop/development-shell.sh &&
        {{ item.validation }}
  loop:
    - shell: bash
      validation: declare -F node npm npx ng op lh lhr >/dev/null
    - shell: zsh
      validation: whence -w node npm npx ng op lh lhr >/dev/null
  loop_control:
    label: "{{ item.shell }}"
  register: terminal_development_shell_validation
  changed_when: false
  failed_when: terminal_development_shell_validation.rc != 0
  when: not ansible_check_mode

- name: Consultar instalacao do Oh My Zsh
  ansible.builtin.stat:
    path: "{{ ubuntu_desktop_home }}/.oh-my-zsh/oh-my-zsh.sh"
  register: terminal_oh_my_zsh_file
  when: not ansible_check_mode
  tags: [zsh]

- name: Validar Oh My Zsh e MesloLGM Nerd Font
  ansible.builtin.assert:
    that:
      - terminal_oh_my_zsh_file.stat.isreg | default(false)
  when: not ansible_check_mode
  tags: [zsh]

- name: Validar arquivo de historico ZSH e permissoes
  ansible.builtin.stat:
    path: "{{ ubuntu_desktop_home }}/.zsh_history"
  register: terminal_zsh_history_file
  when:
    - not ansible_check_mode
    - terminal_configure_zsh | bool
  tags: [zsh]

- name: Confirmar arquivo de historico ZSH restrito ao usuario
  ansible.builtin.assert:
    that:
      - terminal_zsh_history_file.stat.isreg | default(false)
      - terminal_zsh_history_file.stat.pw_name == ubuntu_desktop_user
      - terminal_zsh_history_file.stat.mode == '0600'
    fail_msg: O arquivo de historico ZSH deve pertencer ao usuario e ter modo 0600.
  when:
    - not ansible_check_mode
    - terminal_configure_zsh | bool
  tags: [zsh]

- name: Validar configuracao interativa do ZSH, historico e tema
  ansible.builtin.command:
    argv:
      - zsh
      - -ic
      - >-
        [[ "$HISTFILE" == "$HOME/.zsh_history" ]] &&
        [[ "$HISTSIZE" -ge {{ terminal_zsh_history_size }} ]] &&
        [[ "$SAVEHIST" -ge {{ terminal_zsh_history_size }} ]] &&
        [[ -o appendhistory && -o sharehistory && -o extendedhistory ]] &&
        [[ -o hist_ignore_dups && -o hist_ignore_space && -o hist_reduce_blanks ]] &&
        (( $+widgets[autosuggest-accept] )) &&
        (( $+widgets[history-substring-search-up] )) &&
        (( $+widgets[history-substring-search-down] ))
  environment:
    HOME: "{{ ubuntu_desktop_home }}"
  register: terminal_zsh_configuration_validation
  changed_when: false
  failed_when: terminal_zsh_configuration_validation.rc != 0
  when:
    - not ansible_check_mode
    - terminal_configure_zsh | bool
  tags: [zsh]

- name: Validar MesloLGM Nerd Font
  ansible.builtin.command:
    argv: [fc-list, ':family']
  register: terminal_font_validation
  changed_when: false
  failed_when: >-
    terminal_font_validation.rc != 0 or
    'MesloLGM Nerd Font' not in terminal_font_validation.stdout
  when: not ansible_check_mode
